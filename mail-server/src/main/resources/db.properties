# Cấu hình Server. Mọi khoá đều có thể ghi đè bằng biến môi trường
# (VD: MAIL_DB_PASSWORD) hoặc -Dkey=value mà không cần sửa file này.
# Xem bảng đầy đủ trong README.md.

# --- MySQL ---
db.url=jdbc:mysql://localhost:3306/mail_system?useSSL=false&serverTimezone=UTC&connectTimeout=5000&socketTimeout=30000
db.username=root
db.password=1234

# --- Mạng ---
server.port=5000
# Số kết nối TCP đồng thời tối đa
server.maxClients=100
# Đóng kết nối không gửi frame nào trong khoảng thời gian này (giây)
server.idleTimeoutSeconds=300

# --- Lưu trữ ---
# Thư mục chứa tệp đính kèm (tương đối với thư mục chạy Server)
attachments.dir=attachments
