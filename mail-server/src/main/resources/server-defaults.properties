# Giá trị MẶC ĐỊNH của Server (được commit). KHÔNG đặt mật khẩu hay bí mật ở đây.
# Cấu hình riêng của từng máy: config/server.properties (bị .gitignore),
# xem mẫu config/server.properties.example. Có thể ghi đè bằng biến môi
# trường (VD: MAIL_DB_PASSWORD) hoặc -Dkey=value.

# --- MySQL ---
# sslMode=PREFERRED: mã hoá kết nối tới MySQL nếu MySQL hỗ trợ (MySQL 8 bật sẵn TLS).
# MySQL ở máy khác: dùng sslMode=REQUIRED (hoặc VERIFY_CA kèm trustCertificateKeyStoreUrl).
db.url=jdbc:mysql://localhost:3306/mail_system?sslMode=PREFERRED&connectTimeout=5000&socketTimeout=30000
db.poolSize=10
db.username=root
db.password=

# --- Mạng ---
server.port=5000
server.maxClients=100
server.idleTimeoutSeconds=300
# auto | virtual | platform
server.threads=auto

# --- Lưu trữ (tương đối với thư mục gốc dự án) ---
data.dir=data

# --- TLS: keystore tự sinh lần đầu chạy tại data/tls/server.p12 ---
tls.keystorePassword=
# off | want | need  (need = chỉ thiết bị đã duyệt trên bảng giám sát mới kết nối được)
tls.clientAuth=want

# --- Bảng giám sát: http://127.0.0.1:8090 (mã truy cập in ra khi khởi động) ---
monitor.enabled=true
monitor.port=8090

# --- Bảo mật ---
security.loginMaxFailures=5
security.loginLockMinutes=15
security.requestsPerSecond=30
security.requestBurst=120
security.registrationsPerHourPerIp=10
security.resumeTokenMinutes=720
upload.expiryMinutes=30
