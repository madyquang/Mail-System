# Giá trị MẶC ĐỊNH của Server (được commit). KHÔNG đặt mật khẩu hay bí mật ở đây.
# Cấu hình riêng của từng máy: config/server.properties (bị .gitignore),
# xem mẫu config/server.properties.example. Có thể ghi đè bằng biến môi
# trường (VD: MAIL_DB_PASSWORD) hoặc -Dkey=value.

# --- MySQL ---
db.url=jdbc:mysql://localhost:3306/mail_system?useSSL=false&serverTimezone=UTC&connectTimeout=5000&socketTimeout=30000
db.username=root
db.password=

# --- Mạng ---
server.port=5000
server.maxClients=100
server.idleTimeoutSeconds=300

# --- Lưu trữ (tương đối với thư mục gốc dự án) ---
data.dir=data

# --- TLS: keystore tự sinh lần đầu chạy tại data/tls/server.p12 ---
tls.keystorePassword=

# --- Bảo mật ---
security.loginMaxFailures=5
security.loginLockMinutes=15
security.requestsPerSecond=30
security.requestBurst=120
security.registrationsPerHourPerIp=10
